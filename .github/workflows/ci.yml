name: CI

# 2026-09-05 rebuild (owner: Actions burned the whole budget).
# What was wrong: `push: branches ['**']` ran on EVERY push of EVERY branch
# (each agent work unit pushes twice), and the `tests` job ran the full Lua
# suite, which is known not to finish in one process (GH #124) -- on the
# 2-vCPU hosted runner it hangs until GitHub's 6-hour hard kill. Dozens of
# 6-hour zombie jobs per day.
#
# The local pre-push gate (.githooks/pre-push -> luacheck_gate.sh) already
# blocks bad pushes, so CI here is a backstop, not the primary gate.
#   - luacheck: main only, only when Lua actually changed, 10-min timeout.
#   - full test suite: NOT in CI. Run it locally (iron rule 6 dynamic half)
#     or via manual dispatch of the smoke job below when needed.

on:
  push:
    branches: [main]
    paths:
      - 'bots/**'
      - 'game/**'
      - '.luacheckrc'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  luacheck:
    name: Luacheck (static analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y lua-check
      - name: Run luacheck
        run: luacheck bots game --formatter plain

  smoke:
    name: Smoke load (every hero file parses under Lua 5.1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      # ⭐ THROUGH THE RUNNER, NEVER THE FILE (director 2026-09-10, found while
      # ruling GH #624).  `lua5.1 tests/test_smoke_load.lua` was measured on
      # that date: BARE_EXIT=0, zero bytes of output, zero assertions executed.
      # A Lua test file ends with `return tests`; running it directly LOADS the
      # module and returns the table without calling anything, so this job has
      # been green-because-empty since the 2026-09-05 rebuild -- the one CI job
      # that claims "every hero file parses under Lua 5.1" was proving nothing,
      # and its exit code was indistinguishable from a real pass.
      # Same family as GH #200 (the runner's own zero-bodies guard) and GH #171
      # (a line that does not lift the exit code); `tools/agent/rc.sh` refuses
      # this exact command by name, but nothing was refusing it inside CI.
      - name: Smoke test
        run: lua5.1 tests/run_tests.lua test_smoke_load.lua
